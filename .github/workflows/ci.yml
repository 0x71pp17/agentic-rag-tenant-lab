name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest tests/ -v

  parity:
    name: findings reproduce in a real vector DB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-optional.txt

      # Falsifiability check. lab/store.py implements retrieval for this lab, so
      # results measured against it are results about this lab. Chroma is an
      # independent implementation of the same retrieval contract, so a finding
      # that holds against both is a property of the architecture rather than of
      # one codebase. tests/test_chroma_parity.py runs the findings against
      # Chroma. One test asserts a documented negative result: V1 does not
      # transfer verbatim, because Chroma fails closed on a missing metadata key.
      - name: Install with optional deps
        run: pip install -r requirements-optional.txt

      # tests/test_chroma_parity.py opens with pytest.importorskip("chromadb").
      # Targeted at the file directly, a missing Chroma yields exit 5 (no tests
      # collected), which does fail the job but reports it opaquely. Run against
      # the whole tests/ directory it would skip silently among the core passes
      # and exit 0. Assert the dependency is present so the failure names itself
      # either way, and pin the version into the log so the parity claim in the
      # README is tied to a specific Chroma release.
      - name: Confirm the real vector DB is present
        run: python -c "import chromadb; print('chromadb', chromadb.__version__)"

      - name: Run parity tests
        run: python -m pytest tests/test_chroma_parity.py -v -rs

  matrix-regression:
    name: ASR matrix regression
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      # The sweep runs in CI because the scripted backend needs no model, no
      # GPU and no API key. The committed results file is therefore a test
      # fixture: if a defense layer regresses or a payload is accidentally
      # weakened, a cell in the matrix changes and this job fails.
      - name: Regenerate ASR matrix
        run: python -m harness.report --trials 20 --out /tmp/asr.md

      - name: Compare against committed results
        run: |
          # Skip line 1, which carries only the backend name and trial count.
          if ! diff -u <(tail -n +2 results/asr-scripted.md) <(tail -n +2 /tmp/asr.md); then
            echo "::error::ASR matrix drifted from results/asr-scripted.md"
            echo "If this change is intended, run 'make sweep' and commit results/."
            exit 1
          fi
          echo "Matrix matches committed results."

      - name: Publish matrix to job summary
        if: always()
        run: cat /tmp/asr.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: asr-matrix
          path: /tmp/asr.md
          retention-days: 30
