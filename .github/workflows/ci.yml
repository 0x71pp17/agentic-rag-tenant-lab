name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest tests/ -v

  parity:
    name: findings reproduce in a real vector DB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-optional.txt

      # Chroma is a real vector database, so this job answers the question a
      # reviewer will ask: are the findings artifacts of the hand-written store
      # in lab/store.py? These tests assert they reproduce against Chroma, and
      # one asserts a documented negative result (V1 does not transfer verbatim,
      # because Chroma fails closed on a missing metadata key).
      - name: Install with optional deps
        run: pip install -r requirements-optional.txt

      - name: Run parity tests
        run: python -m pytest tests/test_chroma_parity.py -v

  matrix-regression:
    name: ASR matrix regression
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      # The sweep runs in CI because the scripted backend needs no model, no
      # GPU and no API key. The committed results file is therefore a test
      # fixture: if a defense layer regresses or a payload is accidentally
      # weakened, a cell in the matrix changes and this job fails.
      - name: Regenerate ASR matrix
        run: python -m harness.report --trials 20 --out /tmp/asr.md

      - name: Compare against committed results
        run: |
          # Skip line 1, which carries only the backend name and trial count.
          if ! diff -u <(tail -n +2 results/asr-scripted.md) <(tail -n +2 /tmp/asr.md); then
            echo "::error::ASR matrix drifted from results/asr-scripted.md"
            echo "If this change is intended, run 'make sweep' and commit results/."
            exit 1
          fi
          echo "Matrix matches committed results."

      - name: Publish matrix to job summary
        if: always()
        run: cat /tmp/asr.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asr-matrix
          path: /tmp/asr.md
          retention-days: 30
